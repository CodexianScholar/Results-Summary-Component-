<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Results Summary</title>
  </head>
  <body>
    <main>
      <section id="results-summary">
        <div class="results-container">
          <h2 class="reults-heading">Your Result</h2>
          <div class="score-circle">
            <p class="large-number">76</p>
            <p class="small-number">of 100</p>
          </div>
          <h3 class="results-rating">Great</h3>
          <p class="results-description">
            You scored higher than 65% of the people who have taken these test.
          </p>
        </div>

        <div class="summary-container">
          <h2 class="summary-heading">Summary</h2>
          <div class="summary-stats">
            <!-- reaction -->
            <div id="reaction" class="stats">
              <div class="stat-text">
                <img
                  src="./assets/images/icon-reaction.svg"
                  alt="Thunder bolt icon"
                />
                <p class="stat-label">Reaction</p>
                <div class="stat-numbers">
                  <p>
                    <span class="score">80 </span
                    ><span class="total">/ 100</span>
                  </p>
                </div>
              </div>
            </div>
            <!-- Memory -->
            <div id="memory" class="stats">
              <div class="stat-text">
                <img src="./assets/images/icon-memory.svg" alt="Brain icon" />
                <p class="stat-label">Memory</p>
                <div class="stat-numbers">
                  <p>
                    <span class="score">92 </span>
                    <span class="total">/ 100</span>
                  </p>
                </div>
              </div>
            </div>
            <!-- Verbal -->
            <div id="verbal" class="stats">
              <div class="stat-text">
                <img
                  src="./assets/images/icon-verbal.svg"
                  alt="chat bubble icon"
                />
                <p class="stat-label">Verbal</p>
                <div class="stat-numbers">
                  <p>
                    <span class="score">61 </span
                    ><span class="total">/ 100</span>
                  </p>
                </div>
              </div>
            </div>
            <!-- Visual -->
            <div id="visual" class="stats">
              <div class="stat-text">
                <img src="./assets/images/icon-visual.svg" alt="Brian icon" />
                <p class="stat-label">Visual</p>
                <div class="stat-numbers">
                  <p>
                    <span class="score">73 </span
                    ><span class="total">/ 100</span>
                  </p>
                </div>
              </div>
            </div>
          </div>
          <div class="btn-container">
            <button id="btn">Continue</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
